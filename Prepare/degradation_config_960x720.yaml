# Standalone offline degradation config for 960x720 animal videos.
# This file is intentionally under Prepare/ so the offline preprocessing tool is
# decoupled from FlashVSR training code and training data configs.

metadata_csv_path: "data/metadata_wxh_960x720.csv"
lq_output_dir: "/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/line_buffer_research/vsr_datasets/animal_videos/videos_960x720/lq"

frame_num: 93
crop_height: 720
crop_width: 960
scl_factor: 4.0
input_bits: 10

# Real-ESRGAN-style degradation flags.
degradation_1: true
degradation_2: true
degradation_3: true

# First degradation process.
kernel_list: ["iso", "aniso", "generalized_iso", "generalized_aniso", "plateau_iso", "plateau_aniso"]
kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
blur_sigma: [0.2, 3]
betag_range: [0.5, 4]
betap_range: [1, 2]
sinc_prob: 0.1
first_blur_prob: 1.0

resize_prob: [0.1, 0.2, 0.7]
resize_range: [0.15, 1.5]
noise_prob: 1.0
gaussian_noise_prob: 0.5
noise_range: [0.5, 20]
poisson_scale_range: [0.015, 2]
gray_noise_prob: 0.9

# Second degradation process.
kernel_list2: ["iso", "aniso", "generalized_iso", "generalized_aniso", "plateau_iso", "plateau_aniso"]
kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
blur_sigma2: [0.2, 1.5]
betag_range2: [0.5, 4]
betap_range2: [1, 2]
sinc_prob2: 0.1
second_blur_prob: 0.8

resize_prob2: [0.3, 0.4, 0.3]
resize_range2: [0.3, 1.2]
noise_prob2: 1.0
gaussian_noise_prob2: 0.5
noise_range2: [0.5, 20]
poisson_scale_range2: [0.015, 2]
gray_noise_prob2: 0.9

# Final low-pass + scale-factor down/up process.
final_sinc_prob: 0.3
final_sinc_stage: "post_lr"
final_upsample_mode: "bilinear"
final_downsample_mode_probs:
  area: 0.3333333333
  bilinear: 0.3333333333
  bicubic: 0.3333333334
